
server:
  port: 8080
  address: 127.0.0.1

spring:
  application:
    name: autocommerce-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/autocommerce}
    username: ${DB_USER:autocommerce}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
